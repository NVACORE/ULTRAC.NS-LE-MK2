name: Deploy theme to codeblk.app

on:
  push:
    branches: [main]
    paths: ['ultraconsolemk2/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Back up current theme on server
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p ~/theme-backups && tar -czf ~/theme-backups/ultraconsolemk2-\$(date +%Y%m%d-%H%M%S).tar.gz -C \"\$(dirname '${{ secrets.VPS_THEME_PATH }}')\" \"\$(basename '${{ secrets.VPS_THEME_PATH }}')\" || true"

      - name: Upload theme
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            ultraconsolemk2/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_THEME_PATH }}/"
